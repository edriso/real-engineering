<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f7f5f0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141413"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/real-engineering/favicon.svg"
    />
    <!--app-head-->
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem('re:theme');
        if (t === '"light"' || t === '"dark"')
          document.documentElement.dataset.theme = JSON.parse(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
